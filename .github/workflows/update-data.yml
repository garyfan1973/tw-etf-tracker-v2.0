name: 更新 ETF 資料

on:
  # 自動排程已移至 Google Cloud Scheduler；GitHub 只保留人工備援。
  workflow_dispatch:

# 讓預設 token 有權限把更新後的資料 commit 回 repo
permissions:
  contents: write

# 避免多次執行同時 push 造成衝突
concurrency:
  group: repository-data-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 取出 repo（含過往資料快照）
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取並更新資料
        run: |
          python3 fetch_etf_list.py
          python3 fetch.py
          python3 fetch_price_history.py
          python3 fetch_macro_markets.py
          python3 fetch_company_profiles.py
          if [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            python3 record_daily_snapshots.py
          else
            echo "未設定 SUPABASE_SERVICE_ROLE_KEY，略過每日績效快照"
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: 有變更才 commit 回 repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data webapp/data.js webapp/price-history webapp/etf_overview.json webapp/shareholder_distribution.json webapp/etf_directory.json webapp/company_profiles.json webapp/market_data.json fetch_company_profiles.py fetch_price_history.py fetch_macro_markets.py
          if git diff --cached --quiet; then
            echo "資料無變更，略過 commit"
          else
            git commit -m "chore(data)：自動更新 ETF 持股/行情/配息 $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
