name: 更新 ETF 資料

on:
  # 每天台灣時間 17:37、18:00、18:30、19:00（UTC+8）執行；非交易日會依資料來源日期覆蓋最新快照
  schedule:
    - cron: "37 9 * * *"   # 17:37
    - cron: "0 10 * * *"   # 18:00
    - cron: "30 10 * * *"  # 18:30
    - cron: "0 11 * * *"   # 19:00
  # 允許在 GitHub 網頁手動觸發（Actions 分頁 → Run workflow）
  workflow_dispatch:

# 讓預設 token 有權限把更新後的資料 commit 回 repo
permissions:
  contents: write

# 避免多次執行同時 push 造成衝突
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 取出 repo（含過往資料快照）
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取並更新資料
        run: |
          python3 fetch_etf_list.py
          python3 fetch.py
          python3 fetch_company_profiles.py
          if [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            python3 record_daily_snapshots.py
          else
            echo "未設定 SUPABASE_SERVICE_ROLE_KEY，略過每日績效快照"
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: 有變更才 commit 回 repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data webapp/data.js webapp/etf_directory.json webapp/company_profiles.json fetch_company_profiles.py
          if git diff --cached --quiet; then
            echo "資料無變更，略過 commit"
          else
            git commit -m "chore(data)：自動更新 ETF 持股/行情/配息 $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
