name: 會員 AI 晨報

on:
  # 自動排程已移至 Google Cloud Scheduler；GitHub 只保留人工備援。
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只產生分析與 PDF，不實際寄信"
        required: false
        type: boolean
        default: false
      force:
        description: "忽略當日已完成紀錄，重新分析並寄送"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: member-morning-report
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝瀏覽器
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: 逐檔產生並寄送晨報
        run: python scripts/morning_report.py ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.force && '--force' || '' }}
        env:
          MORNING_REPORT_BASE_URL: https://tw-etf-tracker-v2-0.vercel.app
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
