name: 一次性轉移 Cloud Run Secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: 登入一次性 Google Cloud 身分
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SECRET_BOOTSTRAP_CREDENTIALS }}

      - name: 安裝 Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: 轉移既有 Supabase secrets
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL}"
          test -n "${SUPABASE_SERVICE_ROLE_KEY}"
          printf '%s' "${SUPABASE_URL}" \
            | gcloud secrets versions add supabase-url --data-file=- --project tw-etf-market-batches
          printf '%s' "${SUPABASE_SERVICE_ROLE_KEY}" \
            | gcloud secrets versions add supabase-service-role-key --data-file=- --project tw-etf-market-batches
