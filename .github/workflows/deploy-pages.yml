name: 部署 ETF Tracker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 取出網站檔案
        uses: actions/checkout@v4

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 打包網站
        uses: actions/upload-pages-artifact@v3
        with:
          path: webapp

      - name: 發布網站
        id: deployment
        uses: actions/deploy-pages@v4
