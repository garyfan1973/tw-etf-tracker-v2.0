<!DOCTYPE html>
<html lang="zh-Hant-tw">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>主動式 ETF 每日加減碼查詢</title>
  <style>
    /* 淺色（預設）；--detail 為展開明細的底色，刻意跟 --card 區隔 */
    :root, :root[data-theme="light"] {
      --bg: #f5f6f8; --card: #ffffff; --text: #1c2430; --muted: #6b7684;
      --border: #e3e7ec; --up: #d64545; --down: #1f9d55; --new: #2563eb;
      --removed: #8a8f98; --accent: #3b5bdb; --detail: #eaeefb; --chip: #eef1f6;
    }
    /* 深色變數（供系統偏好與手動切換共用） */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #14181d; --card: #1c2229; --text: #e6e9ed; --muted: #98a2b0;
        --border: #2a323b; --up: #ff6b6b; --down: #51cf82; --new: #4d8dff;
        --removed: #7a828c; --accent: #6c8cff; --detail: #222c3b; --chip: #262d36;
      }
    }
    :root[data-theme="dark"] {
      --bg: #14181d; --card: #1c2229; --text: #e6e9ed; --muted: #98a2b0;
      --border: #2a323b; --up: #ff6b6b; --down: #51cf82; --new: #4d8dff;
      --removed: #7a828c; --accent: #6c8cff; --detail: #222c3b; --chip: #262d36;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
      line-height: 1.5; padding: 20px;
    }
    .wrap { max-width: 1000px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
    .controls {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 14px; margin-bottom: 16px;
    }
    .controls label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 3px; }
    select, input[type="search"] {
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 8px; padding: 7px 10px; font-size: 14px; min-width: 120px;
    }
    .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px 14px; text-align: center;
    }
    .card .n { font-size: 26px; font-weight: 700; }
    .card .l { font-size: 12px; color: var(--muted); }
    .card.new .n { color: var(--new); }
    .card.up .n { color: var(--up); }
    .card.down .n { color: var(--down); }
    .card.removed .n { color: var(--removed); }
    h2 { font-size: 15px; margin: 20px 0 8px; }
    table { width: 100%; border-collapse: collapse; background: var(--card);
      border: 1px solid var(--border); border-radius: 12px; overflow: hidden; font-size: 14px; }
    th, td { padding: 9px 12px; text-align: right; border-bottom: 1px solid var(--border); }
    th { background: transparent; color: var(--muted); font-weight: 600; cursor: pointer; user-select: none; white-space: nowrap; }
    th:first-child, td:first-child { text-align: left; }
    tr:last-child td { border-bottom: none; }
    .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; color: #fff; }
    .tag.new { background: var(--new); }
    .tag.up { background: var(--up); }
    .tag.down { background: var(--down); }
    .tag.removed { background: var(--removed); }
    .delta-up { color: var(--up); }
    .delta-down { color: var(--down); }
    .num { font-variant-numeric: tabular-nums; }
    .empty { color: var(--muted); padding: 14px; text-align: center; font-size: 14px; }
    .barcell { position: relative; }
    .bar { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); opacity: .12; }
    .scroll { overflow-x: auto; }
    /* 可展開的持股列 */
    #full tbody tr.main { cursor: pointer; }
    #full tbody tr.main:hover td { background: rgba(127,127,127,.06); }
    .caret { display: inline-block; width: 14px; color: var(--muted); transition: transform .15s; }
    tr.open .caret { transform: rotate(90deg); }
    .mkt { display: inline-block; font-size: 10px; padding: 0 6px; border-radius: 4px;
      background: #e6edf8; color: #334155; border: 1px solid #cbd8ea; vertical-align: 1px; }
    .market-flag { display: inline-block; margin-left: 4px; font-size: 15px; line-height: 1; vertical-align: -1px; }
    @media (prefers-color-scheme: dark) {
      .mkt { background: #2a323b; color: #e6e9ed; border-color: #3b4653; }
    }
    .price-up { color: var(--up); }
    .price-down { color: var(--down); }
    /* 展開明細：用 --detail 底色 + 左側強調線，與收合列明顯區隔 */
    #full tbody tr.main.open td { background: var(--detail); }
    .detail-row td { padding: 0; border-bottom: 2px solid var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
    .detail {
      display: flex; flex-wrap: nowrap; gap: 1px; overflow-x: auto;
      background: var(--border); padding: 2px 0;
    }
    .detail div { flex: 1 0 74px; min-width: 74px; background: var(--detail); padding: 10px 12px; }
    .detail .k { font-size: 11px; color: var(--muted); }
    .detail .v { font-size: 15px; font-variant-numeric: tabular-nums; margin-top: 2px; }
    .watch-chip {
      font-size: 12px; padding: 5px 10px; border-radius: 999px; cursor: pointer;
      background: var(--chip); color: var(--muted); border: 1px solid transparent; user-select: none;
    }
    .watch-chip.on { color: #fff; background: var(--accent); border-color: var(--accent); }
    .watch-open { padding: 6px 11px; border: 1px solid var(--accent); border-radius: 8px;
      background: var(--card); color: var(--accent); cursor: pointer; font-size: 13px; }
    .watch-open:hover { background: rgba(59, 91, 219, .08); }
    .watch-modal { display: none; position: fixed; inset: 0; z-index: 90; padding: 24px;
      background: rgba(0, 0, 0, .45); align-items: flex-start; justify-content: center; overflow-y: auto; }
    .watch-dialog { width: min(920px, 100%); margin-top: 7vh; background: var(--card); color: var(--text);
      border: 1px solid var(--border); border-radius: 14px; padding: 18px; box-shadow: 0 16px 40px rgba(0,0,0,.2); }
    .watch-dialog-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .watch-dialog-head h2 { margin: 0; font-size: 18px; color: var(--text); }
    .watch-close { border: 1px solid var(--border); background: var(--bg); color: var(--muted);
      border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 18px; line-height: 1; }
    .theme-toggle {
      margin-left: auto; width: 36px; height: 36px; border-radius: 50%;
      border: 1px solid var(--border); background: var(--card); color: var(--text);
      font-size: 16px; line-height: 1; cursor: pointer; display: inline-flex;
      align-items: center; justify-content: center;
    }
    .theme-toggle:hover { border-color: var(--accent); }
    @media (max-width: 640px) {
      .cards { grid-template-columns: repeat(2, 1fr); }
      .detail { display: grid; grid-template-columns: repeat(2, 1fr); overflow-x: visible; }
      .detail div { min-width: 0; flex: initial; }
    }
  </style>
  <script>
    // 進頁前先套用已存的主題，避免閃爍
    (function () { var t = localStorage.getItem("etf-theme"); if (t) document.documentElement.dataset.theme = t; })();
  </script>
</head>
<body>
  <div class="wrap">
    <nav style="display:flex;gap:8px;margin-bottom:14px;align-items:center;">
      <a href="index.html" style="text-decoration:none;font-size:14px;padding:6px 12px;border-radius:8px;color:#fff;background:var(--accent);">持股 / 加減碼</a>
      <a href="dividends.html" style="text-decoration:none;font-size:14px;padding:6px 12px;border-radius:8px;color:var(--muted);border:1px solid var(--border);">配息日曆</a>
      <a href="portfolio.html" style="text-decoration:none;font-size:14px;padding:6px 12px;border-radius:8px;color:var(--muted);border:1px solid var(--border);">我的持股</a>
      <a href="transactions.html" style="text-decoration:none;font-size:14px;padding:6px 12px;border-radius:8px;color:var(--muted);border:1px solid var(--border);">交易紀錄</a>
      <a href="performance.html" style="text-decoration:none;font-size:14px;padding:6px 12px;border-radius:8px;color:var(--muted);border:1px solid var(--border);">績效走勢</a>
      <a href="kline.html" style="text-decoration:none;font-size:14px;padding:6px 12px;border-radius:8px;color:var(--muted);border:1px solid var(--border);">K 線圖</a>
      <span id="authBox" style="margin-left:auto;display:flex;align-items:center;gap:6px;"></span>
      <button id="watchOpen" class="watch-open" style="display:none;">⭐ 我的關注</button>
      <button id="themeToggle" class="theme-toggle" style="margin-left:8px;" aria-label="切換主題">🌙</button>
    </nav>
    <h1>主動式 ETF 每日加減碼查詢</h1>
    <div class="sub" id="sub">載入中…</div>

    <div class="controls">
      <div>
        <label>ETF</label>
        <select id="etf"></select>
      </div>
      <div>
        <label>比較基準日（前）</label>
        <select id="from"></select>
      </div>
      <div>
        <label>目標日（後）</label>
        <select id="to"></select>
      </div>
      <div style="flex:1; min-width:160px;">
        <label>搜尋個股 / 代號</label>
        <input type="search" id="q" placeholder="例如 台積電 或 2330" style="width:100%;">
      </div>
      <div style="display:flex;align-items:flex-end;">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;color:var(--text);margin-bottom:2px;">
          <input type="checkbox" id="onlyMine"> ⭐ 只看我的
        </label>
      </div>
    </div>

    <div id="watchModal" class="watch-modal" role="dialog" aria-modal="true" aria-labelledby="watchTitle">
      <div class="watch-dialog">
        <div class="watch-dialog-head">
          <h2 id="watchTitle">我的關注 ETF</h2>
          <button id="watchClose" class="watch-close" aria-label="關閉">×</button>
        </div>
        <div id="memberPanel" style="display:none;"></div>
      </div>
    </div>

    <div class="cards">
      <div class="card new"><div class="n" id="c-new">0</div><div class="l">新增</div></div>
      <div class="card up"><div class="n" id="c-up">0</div><div class="l">加碼</div></div>
      <div class="card down"><div class="n" id="c-down">0</div><div class="l">減碼</div></div>
      <div class="card removed"><div class="n" id="c-rm">0</div><div class="l">剔除</div></div>
    </div>

    <h2>加減碼明細（依股數變動）</h2>
    <div class="scroll">
      <table id="diff">
        <thead><tr>
          <th data-k="name">個股</th><th data-k="status">狀態</th>
          <th data-k="sharesPrev">前一日股數</th><th data-k="sharesNow">目標日股數</th>
          <th data-k="sharesDelta">股數變動</th><th data-k="weightNow">目前權重%</th>
          <th data-k="weightDelta">權重變動</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>

    <h2>完整持股（目標日）<span style="font-size:12px;color:var(--muted);font-weight:400;">　點任一列展開開高低收明細</span></h2>
    <div class="scroll">
      <table id="full">
        <thead><tr>
          <th data-k="name">個股</th><th data-k="weight">權重%</th>
          <th data-k="shares">持有股數</th>
          <th data-k="close">收盤</th><th data-k="changePct">漲跌幅</th>
          <th data-k="volume">成交量(張)</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script src="theme.js"></script>
  <script src="config.js"></script>
  <script src="data.js"></script>
  <script type="module" src="auth.js"></script>
  <script>
    // 若 data.js 尚未產生，給出友善提示
    if (typeof window.DATA === "undefined") {
      document.getElementById("sub").textContent =
        "尚無資料。請先在終端機執行：python3 fetch.py，產生 data.js 後重新整理。";
    } else {
      loadCompanyProfiles().then(init);
    }

    let COMPANY_PROFILES = {};
    async function loadCompanyProfiles() {
      try {
        const r = await fetch("company_profiles.json", { cache: "no-store" });
        if (r.ok) COMPANY_PROFILES = await r.json();
      } catch (_) { /* 公司資料不是主行情資料，載入失敗時仍可正常使用 */ }
    }

    function init() {
      const D = window.DATA;
      const etfSel = document.getElementById("etf");
      const fromSel = document.getElementById("from");
      const toSel = document.getElementById("to");
      const q = document.getElementById("q");

      document.getElementById("sub").textContent =
        "資料更新時間：" + D.generated_at + "　來源：MoneyDJ 每日持股揭露";

      // 填入 ETF 下拉（勾「只看我的」且有登入關注清單時，只列關注的）
      function fillEtfOptions() {
        const onlyMine = document.getElementById("onlyMine");
        const mine = (onlyMine && onlyMine.checked && window.ETFWatch && window.ETFWatch.user())
          ? window.ETFWatch.list() : [];
        const allow = mine.length ? new Set(mine) : null;  // 空清單視為不篩選
        const prev = etfSel.value;
        etfSel.innerHTML = "";
        Object.keys(D.etfs).forEach(id => {
          if (allow && !allow.has(id)) return;
          const o = document.createElement("option");
          o.value = id; o.textContent = id + " " + D.etfs[id].name;
          etfSel.appendChild(o);
        });
        const vals = [...etfSel.options].map(o => o.value);
        etfSel.value = vals.includes(prev) ? prev : (vals[0] || "");
      }

      let sortState = { diff: { k: "sharesDelta", asc: false }, full: { k: "weight", asc: false } };
      const expandedFull = new Set();  // 記住展開了哪些個股，重繪時保留

      function currentSnapshots() {
        const e = D.etfs[etfSel.value];
        return e ? e.snapshots : [];
      }

      function fillDates() {
        const snaps = currentSnapshots();
        fromSel.innerHTML = ""; toSel.innerHTML = "";
        snaps.forEach(s => {
          fromSel.appendChild(new Option(s.date, s.date));
          toSel.appendChild(new Option(s.date, s.date));
        });
        // 預設：目標日=最新，基準日=前一筆
        toSel.value = snaps[snaps.length - 1].date;
        fromSel.value = snaps[Math.max(0, snaps.length - 2)].date;
      }

      function snapByDate(d) {
        return currentSnapshots().find(s => s.date === d);
      }

      // 持股識別鍵：有代號用代號，無代號（海外股）用名稱
      const keyOf = h => h.code || h.name;

      // 計算加減碼
      function computeDiff(prevSnap, currSnap) {
        const prev = {}, curr = {};
        (prevSnap ? prevSnap.holdings : []).forEach(h => prev[keyOf(h)] = h);
        currSnap.holdings.forEach(h => curr[keyOf(h)] = h);
        const rows = [];
        // 目標日有的
        currSnap.holdings.forEach(h => {
          const p = prev[keyOf(h)];
          if (!p) {
            rows.push(mk(h, "new", null, h));
          } else if (h.shares > p.shares) {
            rows.push(mk(h, "up", p, h));
          } else if (h.shares < p.shares) {
            rows.push(mk(h, "down", p, h));
          }
        });
        // 被剔除的
        (prevSnap ? prevSnap.holdings : []).forEach(h => {
          if (!curr[keyOf(h)]) rows.push(mk(h, "removed", h, null));
        });
        return rows;
      }

      function mk(base, status, p, c) {
        return {
          name: base.name, code: base.code || "", market: base.market || "", status: status,
          sharesPrev: p ? p.shares : null,
          sharesNow: c ? c.shares : null,
          sharesDelta: (c ? c.shares : 0) - (p ? p.shares : 0),
          weightNow: c ? c.weight : 0,
          weightDelta: (c ? c.weight : 0) - (p ? p.weight : 0),
        };
      }

      const TAG = { new: "新增", up: "加碼", down: "減碼", removed: "剔除" };
      const fmt = n => n === null ? "—" : n.toLocaleString("en-US");
      const sign = n => (n > 0 ? "+" : "") + n.toLocaleString("en-US");
      const signW = n => (n > 0 ? "+" : "") + n.toFixed(2);

      function render() {
        const currSnap = snapByDate(toSel.value);
        const prevSnap = snapByDate(fromSel.value);
        if (!currSnap) return;
        let diffRows = computeDiff(prevSnap, currSnap);

        // 統計卡
        const cnt = { new: 0, up: 0, down: 0, removed: 0 };
        diffRows.forEach(r => cnt[r.status]++);
        document.getElementById("c-new").textContent = cnt.new;
        document.getElementById("c-up").textContent = cnt.up;
        document.getElementById("c-down").textContent = cnt.down;
        document.getElementById("c-rm").textContent = cnt.removed;

        // 搜尋過濾
        const kw = q.value.trim().toLowerCase();
        const match = r => !kw || r.name.toLowerCase().includes(kw) || (r.code || "").toLowerCase().includes(kw);

        // 加減碼表
        const dr = diffRows.filter(match);
        sortRows(dr, sortState.diff);
        const dbody = document.querySelector("#diff tbody");
        dbody.innerHTML = "";
        if (!dr.length) {
          dbody.innerHTML = '<tr><td colspan="7" class="empty">此區間無加減碼（或尚無前一交易日資料可比對）</td></tr>';
        }
        dr.forEach(r => {
          const tr = document.createElement("tr");
          const dCls = r.sharesDelta > 0 ? "delta-up" : r.sharesDelta < 0 ? "delta-down" : "";
          const wCls = r.weightDelta > 0 ? "delta-up" : r.weightDelta < 0 ? "delta-down" : "";
          tr.innerHTML =
            '<td>' + r.name + '</td>' +
            '<td><span class="tag ' + r.status + '">' + TAG[r.status] + '</span></td>' +
            '<td class="num">' + fmt(r.sharesPrev) + '</td>' +
            '<td class="num">' + fmt(r.sharesNow) + '</td>' +
            '<td class="num ' + dCls + '">' + sign(r.sharesDelta) + '</td>' +
            '<td class="num">' + (r.weightNow ? r.weightNow.toFixed(2) : "—") + '</td>' +
            '<td class="num ' + wCls + '">' + signW(r.weightDelta) + '</td>';
          dbody.appendChild(tr);
        });

        // 完整持股表（精簡主列 + 可展開明細）
        let full = currSnap.holdings.slice().filter(match);
        sortRows(full, sortState.full);
        const maxW = Math.max.apply(null, currSnap.holdings.map(h => h.weight));
        const fbody = document.querySelector("#full tbody");
        fbody.innerHTML = "";
        full.forEach(h => {
          const key = keyOf(h);
          const opened = expandedFull.has(key);
          const pctCls = pxCls(h.changePct);
          const arrow = h.changePct > 0 ? "▲" : h.changePct < 0 ? "▼" : "";
          const codeTxt = h.code ? ' <span style="color:var(--muted);font-size:12px;">' + h.code + '</span>' : "";
          // 主列
          const tr = document.createElement("tr");
          tr.className = "main" + (opened ? " open" : "");
          tr.innerHTML =
            '<td><span class="caret">▸</span> ' + h.name + codeTxt + mktTag(h, etfSel.value) + '</td>' +
            '<td class="num barcell"><span class="bar" style="width:' + (h.weight / maxW * 100) + '%"></span>' + h.weight.toFixed(2) + '</td>' +
            '<td class="num">' + h.shares.toLocaleString("en-US") + '</td>' +
            '<td class="num">' + px(h.close) + '</td>' +
            '<td class="num ' + pctCls + '">' + (h.changePct == null ? "—" : arrow + " " + signW(h.changePct) + "%") + '</td>' +
            '<td class="num">' + vol(h.volume) + '</td>';
          tr.addEventListener("click", () => {
            if (expandedFull.has(key)) expandedFull.delete(key);
            else { expandedFull.clear(); expandedFull.add(key); }
            render();
          });
          fbody.appendChild(tr);
          // 明細列
          if (opened) {
            const dtr = document.createElement("tr");
            dtr.className = "detail-row";
            const chCls = pxCls(h.change);
            const cur = h.currency || (h.market === "TW" ? "TWD" : "—");
            const profile = COMPANY_PROFILES[h.code || h.name] || {};
            const industry = [profile.sector, profile.industry].filter(Boolean).join("／") || "—";
            dtr.innerHTML = '<td colspan="6"><div class="detail">' +
              cell("市場", marketName(h)) +
              cell("幣別", cur) +
              cell("開盤", px(h.open)) +
              cell("最高", px(h.high)) +
              cell("最低", px(h.low)) +
              cell("前日收盤", px(h.prevClose)) +
              cell("漲跌", h.change == null ? "—" : signW(h.change), chCls) +
              cell("振幅", h.amplitude == null ? "—" : h.amplitude.toFixed(2) + "%") +
              (h.quoteDate ? cell("行情日", h.quoteDate) : "") +
              profileCell("產業別", industry) +
              '</div></td>';
            fbody.appendChild(dtr);
          }
        });
      }

      // 行情顯示小工具
      const px = v => v == null ? "—" : v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const vol = v => v == null ? "—" : Math.round(v / 1000).toLocaleString("en-US");
      const pxCls = v => v > 0 ? "price-up" : v < 0 ? "price-down" : "";
      const cell = (k, v, cls) => '<div><div class="k">' + k + '</div><div class="v ' + (cls || "") + '">' + v + '</div></div>';
      const esc = v => String(v == null ? "" : v).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#39;");
      const profileCell = (k, v) => cell(k, esc(v || "—"));
      // 市場別
      const MKT = { TW: "台股", US: "美股", JP: "日股", KS: "韓股", HK: "港股", CN: "陸股", DE: "德股", GB: "英股" };
      const MARKET_FLAGS = { TW: "🇹🇼", US: "🇺🇸", JP: "🇯🇵", KS: "🇰🇷", HK: "🇭🇰", CN: "🇨🇳", DE: "🇩🇪", GB: "🇬🇧" };
      const marketName = h => h.market ? (MKT[h.market] || h.market) : "海外";
      const mktTag = (h, etfCode) => {
        if (etfCode === "00990A") {
          return h.market && h.market !== "TW"
            ? ' <span class="market-flag" title="' + marketName(h) + '" aria-label="' + marketName(h) + '">' + (MARKET_FLAGS[h.market] || "") + '</span>'
            : "";
        }
        return h.market && h.market !== "TW"
          ? ' <span class="mkt">' + marketName(h) + '</span>'
          : (!h.market ? ' <span class="mkt">海外</span>' : "");
      };

      function sortRows(rows, st) {
        rows.sort((a, b) => {
          let x = a[st.k], y = b[st.k];
          if (typeof x === "string") { x = x || ""; y = y || ""; return st.asc ? x.localeCompare(y) : y.localeCompare(x); }
          x = (x == null) ? -Infinity : x; y = (y == null) ? -Infinity : y;
          return st.asc ? x - y : y - x;
        });
      }

      // 表頭排序
      function bindSort(tableId, key) {
        document.querySelectorAll("#" + tableId + " th").forEach(th => {
          th.addEventListener("click", () => {
            const k = th.getAttribute("data-k");
            const st = sortState[key];
            st.asc = st.k === k ? !st.asc : false;
            st.k = k;
            render();
          });
        });
      }
      bindSort("diff", "diff");
      bindSort("full", "full");

      etfSel.addEventListener("change", () => { fillDates(); render(); });
      fromSel.addEventListener("change", render);
      toSel.addEventListener("change", render);
      q.addEventListener("input", render);

      // 「只看我的」切換、或關注清單有變動時，重建 ETF 選單
      document.getElementById("onlyMine").addEventListener("change", () => { fillEtfOptions(); fillDates(); render(); });
      document.addEventListener("etfwatch:change", () => { fillEtfOptions(); fillDates(); render(); });
      // 剛新增的代號：即時切換到它並顯示資料
      document.addEventListener("etf-added", (e) => {
        const code = e.detail && e.detail.code;
        if (!code || !D.etfs[code]) return;
        fillEtfOptions();
        if ([...etfSel.options].some(o => o.value === code)) {
          etfSel.value = code; fillDates(); render();
        }
      });

      fillEtfOptions();
      fillDates();
      render();
    }
  </script>
</body>
</html>
