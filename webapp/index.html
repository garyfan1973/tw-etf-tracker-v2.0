    <nav class="market-tabs" aria-label="市場快速導覽"><a class="active" href="#taiwanMarket">台股</a><a href="tracker.html">ETF</a><a href="#globalMarket">國際</a></nav>
    <div id="homeError" class="home-error" hidden></div>

      <div id="twHighlights" class="tw-highlights" aria-label="台股分類指數"></div>
