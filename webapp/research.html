<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>市場研究｜ETF 追追追</title>
  <style>
    :root, :root[data-theme="light"] { --bg:#f5f6f8; --card:#fff; --text:#1c2430; --muted:#6b7684; --border:#e3e7ec; --accent:#3b5bdb; --up:#d64545; --down:#1f9d55; }
    @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181d;--card:#1c2229;--text:#e6e9ed;--muted:#98a2b0;--border:#2a323b;--accent:#6c8cff;--up:#ff8787;--down:#69db7c}}
    :root[data-theme="dark"]{--bg:#14181d;--card:#1c2229;--text:#e6e9ed;--muted:#98a2b0;--border:#2a323b;--accent:#6c8cff;--up:#ff8787;--down:#69db7c}
    *{box-sizing:border-box} body{margin:0;padding:20px;background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}.wrap{max-width:1180px;margin:auto}nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:22px}nav a{padding:6px 12px;border:1px solid var(--border);border-radius:8px;color:var(--muted);text-decoration:none;font-size:14px}nav a.active{background:var(--accent);border-color:var(--accent);color:#fff}h1{font-size:28px;margin:0 0 5px}.sub{color:var(--muted);margin-bottom:20px}.research-layout{display:grid;grid-template-columns:300px 1fr;gap:14px}.panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}.market-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}.market-tabs button{padding:9px 6px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--muted);cursor:pointer}.market-tabs button.active{background:var(--accent);border-color:var(--accent);color:#fff}.search{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}.result-meta{display:block;color:var(--muted);font-size:12px;margin:12px 0 6px}.asset-results{display:grid;gap:5px;max-height:620px;overflow:auto}.asset-result{display:grid;grid-template-columns:70px 1fr;gap:0 8px;padding:8px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--text);text-align:left;cursor:pointer}.asset-result:hover{background:var(--bg);border-color:var(--border)}.asset-result strong{grid-row:span 2}.asset-result span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.asset-result small{color:var(--muted);font-size:11px}.empty{padding:24px;color:var(--muted);text-align:center}.instrument-card{min-height:510px}.instrument-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.instrument-market{color:var(--accent);font-size:12px}.instrument-head h2{margin:4px 0 0;font-size:24px}.instrument-head h2 small{font-size:15px;color:var(--muted);font-weight:400}.instrument-price{text-align:right}.instrument-price strong{font-size:30px}.instrument-price span{display:block;font-size:14px}.up{color:var(--up)}.down{color:var(--down)}.instrument-meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:16px;color:var(--muted);font-size:12px}.instrument-chart{margin-top:26px;border:1px solid var(--border);border-radius:10px;padding:12px;background:var(--bg)}.instrument-chart svg{display:block;width:100%;height:auto}.chart-grid{stroke:var(--border)}.chart-axis{fill:var(--muted);font-size:11px}.source-note{color:var(--muted);font-size:11px}.loading{color:var(--muted);padding:30px;text-align:center}@media(max-width:800px){.research-layout{grid-template-columns:1fr}.asset-results{max-height:260px}.instrument-card{min-height:0}.instrument-head h2{font-size:20px}}
  </style>
  <script>(function(){var t=localStorage.getItem("etf-theme");if(t)document.documentElement.dataset.theme=t;})();</script>
</head>
<body><div class="wrap">
  <nav><a href="index.html">ETF 追追追</a><a href="tracker.html">持股資訊</a><a href="research.html" class="active">市場研究</a><a href="dividends.html">配息日曆</a><a href="portfolio.html">我的持股</a></nav>
  <h1>市場研究</h1><div class="sub">從台股、台灣 ETF、美股與美國 ETF，搜尋任何標的並查看統一行情。</div>
  <div class="research-layout"><aside class="panel"><div class="market-tabs"><button type="button" data-market-type="TW-etf" class="active">台灣 ETF</button><button type="button" data-market-type="TW-stock">台股</button><button type="button" data-market-type="US-etf">美國 ETF</button><button type="button" data-market-type="US-stock">美股</button></div><input id="assetSearch" class="search" type="search" placeholder="搜尋代號或名稱"><span id="resultMeta" class="result-meta">載入標的清單…</span><div id="assetResults" class="asset-results"></div></aside>
    <main class="panel"><div id="instrumentLoading" class="loading">載入行情中…</div><div id="instrumentEmpty" class="empty" hidden>請從左側選擇標的。</div><section id="instrumentCard" class="instrument-card" hidden></section></main>
  </div>
</div><script src="theme.js"></script><script src="research.js"></script></body></html>
