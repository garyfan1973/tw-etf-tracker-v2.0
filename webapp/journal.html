<!DOCTYPE html>
<html lang="zh-Hant-tw">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>短線操作日誌</title>
  <style>
    :root, :root[data-theme="light"] { --bg:#f5f6f8; --card:#fff; --text:#1c2430; --muted:#6b7684; --border:#e3e7ec; --up:#d64545; --down:#1f9d55; --accent:#3b5bdb; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#14181d; --card:#1c2229; --text:#e6e9ed; --muted:#98a2b0; --border:#2a323b; --up:#ff6b6b; --down:#51cf82; --accent:#6c8cff; } }
    :root[data-theme="dark"] { --bg:#14181d; --card:#1c2229; --text:#e6e9ed; --muted:#98a2b0; --border:#2a323b; --up:#ff6b6b; --down:#51cf82; --accent:#6c8cff; }
    * { box-sizing:border-box; } body { margin:0; padding:20px; background:var(--bg); color:var(--text); font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif; line-height:1.5; }
    .wrap { max-width:1120px; margin:0 auto; } nav { display:flex; gap:8px; align-items:center; margin-bottom:14px; flex-wrap:wrap; } nav a { text-decoration:none; color:var(--muted); font-size:14px; padding:6px 12px; border:1px solid var(--border); border-radius:8px; } nav a.active { color:#fff; background:var(--accent); border-color:var(--accent); }
    .theme-toggle { margin-left:8px; width:36px; height:36px; border-radius:50%; border:1px solid var(--border); background:var(--card); color:var(--text); cursor:pointer; } h1 { font-size:20px; margin:0 0 4px; } h2 { font-size:15px; margin:0 0 12px; } .sub { color:var(--muted); font-size:13px; margin-bottom:16px; }
    .panel, .entry { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:16px; } .form-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; } label { display:flex; flex-direction:column; gap:4px; color:var(--muted); font-size:12px; }
    input, select, textarea, button { font:inherit; } input, select, textarea { width:100%; padding:8px; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text); } textarea { min-height:76px; resize:vertical; } .wide { grid-column:span 2; }
    .fill-panel { margin-top:12px; padding-top:12px; border-top:1px solid var(--border); } .fill-grid { display:grid; grid-template-columns:120px 110px 120px 140px auto; gap:10px; align-items:end; } .actions { display:flex; gap:8px; align-items:center; margin-top:10px; } button { padding:8px 14px; border-radius:8px; cursor:pointer; } button.primary { border:0; color:#fff; background:var(--accent); } button.ghost { border:1px solid var(--border); color:var(--muted); background:transparent; }
    .msg { min-height:18px; color:var(--up); font-size:13px; margin-top:7px; } .filters { display:flex; gap:10px; align-items:end; flex-wrap:wrap; } .filters label { min-width:140px; } .entries { display:grid; gap:10px; } .entry { margin:0; } .entry-top { display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; } .entry-top strong { font-size:16px; } .entry-top .date { color:var(--muted); font-size:13px; }
    .badge { padding:3px 8px; border-radius:999px; font-size:12px; background:rgba(59,91,219,.11); color:var(--accent); } .badge.buy { color:var(--down); background:rgba(31,157,85,.11); } .badge.sell { color:var(--up); background:rgba(214,69,69,.11); } .badge.closed { color:var(--muted); background:rgba(107,118,132,.12); } .entry-actions { margin-left:auto; display:flex; gap:5px; } .entry-actions button { padding:4px 8px; border:1px solid var(--border); background:transparent; color:var(--muted); font-size:12px; } .entry-actions button.delete, .fill-actions button.delete { color:var(--up); }
    .facts { display:flex; flex-wrap:wrap; gap:8px 18px; color:var(--muted); font-size:13px; margin:9px 0; } .facts b { color:var(--text); font-weight:600; } .thesis, .review { white-space:pre-wrap; font-size:13px; margin-top:8px; } .review { color:var(--muted); padding-top:8px; border-top:1px dashed var(--border); }
    .fill-list { border-top:1px dashed var(--border); margin-top:10px; padding-top:8px; } .fill-row { display:flex; gap:10px; align-items:center; padding:6px 0; font-size:12px; color:var(--muted); } .fill-row .fill-actions { margin-left:auto; } .fill-row b { color:var(--text); } .fill-row .buy { color:var(--down); font-weight:700; } .fill-row .sell { color:var(--up); font-weight:700; }
    .table-wrap { overflow-x:auto; } table { width:100%; min-width:980px; border-collapse:collapse; font-size:12px; } th,td { padding:9px 8px; border-bottom:1px solid var(--border); text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; } th { color:var(--muted); font-weight:600; } th:first-child,td:first-child,th:nth-child(2),td:nth-child(2) { text-align:left; } tr:last-child td { border-bottom:0; } .table-title { display:flex; align-items:baseline; gap:8px; } .table-title span { color:var(--muted); font-size:12px; font-weight:400; } .pnl-cell { font-weight:700; }
    .empty { color:var(--muted); font-size:14px; padding:8px 0; } .up { color:var(--up)!important; } .down { color:var(--down)!important; }
    @media(max-width:760px) { body { padding:14px; } .form-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } .wide { grid-column:span 2; } .fill-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } .fill-grid button { width:100%; } }
  </style>
  <script>(function(){var t=localStorage.getItem("etf-theme");if(t)document.documentElement.dataset.theme=t;})();</script>
</head>
<body>
  <div class="wrap">
    <nav><a href="tracker.html">持股資訊</a><a href="dividends.html">配息日曆</a><a href="portfolio.html">我的持股</a><a href="transactions.html">交易紀錄</a><a href="journal.html" class="active">短線日誌</a><a href="performance.html">績效走勢</a><span id="authBox" style="margin-left:auto;display:flex;align-items:center;gap:6px;"></span><button id="themeToggle" class="theme-toggle" aria-label="切換主題">🌙</button></nav>
    <h1>短線操作日誌</h1><div class="sub">一個日誌可以有多次買進與賣出，系統以 FIFO 配對並計算每次已實現損益。</div>
    <div id="gate" class="panel" style="display:none"></div>
    <div id="app" style="display:none">
      <form class="panel" id="journalForm"><h2 id="formTitle">新增操作日誌</h2><div class="form-grid">
        <label>大類<select id="assetType"><option value="etf">ETF</option><option value="stock">股票</option></select></label><label>市場<select id="market"><option value="tw">台灣</option><option value="us">美國</option></select></label><label>代號<input id="symbol" list="assetOptions" autocomplete="off" placeholder="例如 00981A／GOOGL" required><datalist id="assetOptions"></datalist></label><label>名稱（選填）<input id="assetName" autocomplete="off" placeholder="選擇代號後自動帶入"></label>
        <label>狀態<select id="status"><option value="planned">計畫中</option><option value="open">持有中</option><option value="closed">已結束</option><option value="cancelled">取消</option></select></label><label>停損價<input id="stopLoss" type="number" min="0" step="0.01"></label><label>目標價<input id="targetPrice" type="number" min="0" step="0.01"></label>
        <label class="wide">進場理由／交易計畫<textarea id="thesis" placeholder="例如：突破近 20 日高點，若收盤跌回突破區則停損。"></textarea></label><label class="wide">事後檢討<textarea id="review" placeholder="平倉後記錄執行結果與下次要改進的地方。"></textarea></label>
      </div>
      <div class="fill-panel"><h2>新增進出明細</h2><div class="fill-grid"><label>日期<input id="fillDate" type="date"></label><label>動作<select id="fillSide"><option value="buy">買進</option><option value="sell">賣出</option></select></label><label>股數<input id="fillShares" type="number" min="0" step="1" placeholder="例如 1"></label><label>成交價<input id="fillPrice" type="number" min="0" step="0.01" placeholder="例如 165.06"></label><button class="ghost" type="button" id="addFillBtn">加入明細</button></div><div class="sub" style="margin:7px 0 0">先儲存日誌後，可持續加入分批買進或賣出。</div></div>
      <div class="actions"><button class="primary" type="submit" id="submitBtn">儲存日誌</button><button class="ghost" type="button" id="cancelBtn" style="display:none">取消編輯</button></div><div class="msg" id="formMsg"></div></form>
      <div class="panel"><div class="filters"><label>代號／名稱篩選<input id="filterCode" placeholder="例如 GOOGL"></label><label>大類<select id="filterType"><option value="">全部大類</option><option value="etf">ETF</option><option value="stock">股票</option></select></label><label>市場<select id="filterMarket"><option value="">全部市場</option><option value="tw">台灣</option><option value="us">美國</option></select></label><label>狀態<select id="filterStatus"><option value="">全部狀態</option><option value="planned">計畫中</option><option value="open">持有中</option><option value="closed">已結束</option><option value="cancelled">取消</option></select></label><button class="ghost" type="button" id="clearFilter">清除</button><span class="sub" id="summary" style="margin:0"></span></div></div>
      <div class="panel"><div class="table-title"><h2>FIFO 交易彙總</h2><span>每一筆賣出會配對最早尚未結清的買進部位</span></div><div class="table-wrap"><table><thead><tr><th>標的</th><th>買進日</th><th>賣出日</th><th>股數</th><th>買進價</th><th>賣出價</th><th>原幣</th><th>原幣損益</th><th>USD/TWD</th><th>台幣損益</th><th>狀態</th></tr></thead><tbody id="summaryRows"></tbody></table></div><div id="summaryEmpty" class="empty" style="display:none">目前沒有可彙總的交易。</div></div>
      <div id="entries" class="entries"></div><div id="empty" class="panel empty" style="display:none">目前沒有符合條件的日誌。</div>
    </div>
  </div>
  <script src="theme.js"></script><script src="config.js"></script><script type="module" src="auth.js"></script><script src="journal.js"></script>
</body>
</html>
