<!DOCTYPE html>
<html lang="zh-Hant-tw">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>K 線圖</title>
  <style>
    :root, :root[data-theme="light"] { --bg:#f5f6f8; --card:#fff; --text:#1c2430; --muted:#6b7684; --border:#e3e7ec; --accent:#3b5bdb; --up:#e64949; --down:#2f9e44; --ma5:#e9a23b; --ma20:#a78bca; --kd-k:#19a7a0; --kd-d:#e06b8b; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#14181d; --card:#1c2229; --text:#e6e9ed; --muted:#98a2b0; --border:#2a323b; --accent:#6c8cff; --up:#ff8787; --down:#69db7c; --ma5:#e8b66d; --ma20:#bca8dc; --kd-k:#5fd1ca; --kd-d:#f09ab1; } }
    :root[data-theme="dark"] { --bg:#14181d; --card:#1c2229; --text:#e6e9ed; --muted:#98a2b0; --border:#2a323b; --accent:#6c8cff; --up:#ff8787; --down:#69db7c; --ma5:#e8b66d; --ma20:#bca8dc; --kd-k:#5fd1ca; --kd-d:#f09ab1; }
    * { box-sizing:border-box; }
    body { margin:0; padding:20px; background:var(--bg); color:var(--text); font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif; }
    .wrap { max-width:1180px; margin:0 auto; }
    nav { display:flex; gap:8px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
    nav a { text-decoration:none; color:var(--muted); font-size:14px; padding:6px 12px; border:1px solid var(--border); border-radius:8px; }
    nav a.active { color:#fff; background:var(--accent); border-color:var(--accent); }
    .theme-toggle { margin-left:8px; width:36px; height:36px; border-radius:50%; border:1px solid var(--border); background:var(--card); color:var(--text); cursor:pointer; }
    h1 { font-size:22px; margin:0 0 4px; } .sub { color:var(--muted); font-size:13px; margin-bottom:16px; }
    .panel { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:16px; }
    .controls { display:flex; gap:12px; align-items:end; flex-wrap:wrap; }
    label { display:flex; flex-direction:column; gap:5px; color:var(--muted); font-size:12px; }
    select { min-width:190px; padding:9px 11px; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text); font:inherit; }
    .chart-type { display:flex; padding:3px; border:1px solid var(--border); border-radius:9px; background:var(--bg); }
    .chart-type button { border:0; border-radius:6px; padding:6px 12px; background:transparent; color:var(--muted); font:inherit; cursor:pointer; }
    .chart-type button.active { background:var(--accent); color:#fff; }
    .status { margin-left:auto; color:var(--muted); font-size:12px; }
    .chart-head { display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:8px; }
    .chart-title { font-size:18px; font-weight:700; } .quote { color:var(--muted); font-size:13px; }
    .legend { display:flex; gap:14px; flex-wrap:wrap; color:var(--muted); font-size:12px; margin:4px 0 8px; }
    .legend span { display:inline-flex; align-items:center; gap:5px; } .swatch { width:18px; height:2px; display:inline-block; }
    .chart-wrap { position:relative; } .chart-box { width:100%; overflow:hidden; } .chart-box>svg { display:block; width:100%; height:auto; min-height:360px; }
    .grid { stroke:var(--border); stroke-width:1; } .kd-threshold { stroke-dasharray:4 4; } .axis { fill:var(--muted); font-size:11px; }
    .crosshair { stroke:var(--muted); stroke-width:1; stroke-dasharray:4 4; opacity:.7; }
    .tip { position:absolute; z-index:2; top:8px; left:8px; width:220px; max-width:calc(100% - 16px); padding:8px 10px; border:1px solid var(--border); border-radius:8px; background:color-mix(in srgb, var(--card) 94%, var(--accent)); color:var(--text); font-size:12px; line-height:1.7; min-height:24px; pointer-events:none; box-shadow:0 2px 8px rgba(0,0,0,.08); }
    .signal-panel { margin-top:18px; padding-top:16px; border-top:1px solid var(--border); }
    .signal-heading { display:flex; justify-content:space-between; gap:16px; align-items:flex-start; } .signal-heading h3 { margin:0 0 4px; font-size:18px; } .signal-heading p, .signal-date, .signal-footnote { margin:0; color:var(--muted); font-size:12px; }
    .signal-main { display:grid; grid-template-columns:minmax(300px,38%) 1fr; gap:24px; align-items:center; padding:12px 0 18px; } .signal-overall { text-align:center; } .signal-gauge-svg { display:block; width:100%; max-width:330px; height:auto; margin:auto; overflow:visible; } .signal-axis { fill:var(--muted); font-size:12px; } .signal-label { margin-top:-14px; font-size:25px; font-weight:800; } .signal-score { color:var(--muted); font-size:12px; margin-top:3px; }
    .signal-confidence { display:grid; grid-template-columns:1fr auto; gap:5px 12px; font-size:13px; } .signal-confidence i { grid-column:1/-1; height:7px; background:var(--border); border-radius:10px; overflow:hidden; } .signal-confidence b { display:block; height:100%; background:var(--accent); border-radius:inherit; } .signal-confidence small { grid-column:1/-1; color:var(--muted); }
    .signal-notes { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px; } .signal-notes section { padding:12px; border-radius:10px; background:color-mix(in srgb,var(--down) 8%,var(--card)); } .signal-notes section.risk { background:color-mix(in srgb,var(--up) 8%,var(--card)); } .signal-notes h4 { margin:0 0 7px; font-size:13px; } .signal-notes ul { margin:0; padding-left:18px; color:var(--muted); font-size:12px; line-height:1.65; } .signal-notes p { color:var(--muted); font-size:12px; margin:0; }
    .signal-components { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; } .signal-component { text-align:center; padding:12px 8px; border:1px solid var(--border); border-radius:11px; background:var(--bg); } .signal-component h4 { margin:0; font-size:13px; } .signal-component .signal-gauge-svg { max-width:210px; } .signal-component strong,.signal-component small { display:block; } .signal-component strong { margin-top:-12px; font-size:15px; } .signal-component small { margin-top:4px; color:var(--muted); font-size:11px; } .signal-footnote { margin-top:12px; line-height:1.6; }
    .empty { color:var(--muted); padding:28px 0; text-align:center; }
    .up { color:var(--up); } .down { color:var(--down); }
    @media (max-width:850px) { .signal-main { grid-template-columns:1fr; } .signal-components { grid-template-columns:repeat(2,1fr); } }
    @media (max-width:700px) { body { padding:12px; } .status { width:100%; margin-left:0; } select { min-width:0; width:100%; } .chart-box { overflow-x:auto; } .chart-box>svg { min-width:720px; } }
    @media (max-width:560px) { .signal-heading { display:block; } .signal-date { display:block; margin-top:5px; } .signal-notes,.signal-components { grid-template-columns:1fr; } }
  </style>
  <script>(function(){var t=localStorage.getItem("etf-theme");if(t)document.documentElement.dataset.theme=t;})();</script>
</head>
<body>
  <div class="wrap">
    <nav>
      <a href="tracker.html">持股資訊</a><a href="dividends.html">配息日曆</a><a href="portfolio.html">我的持股</a>
      <a href="transactions.html">交易紀錄</a><a href="performance.html">績效走勢</a>
      <span id="authBox" style="margin-left:auto;display:flex;align-items:center;gap:6px;"></span>
      <button id="themeToggle" class="theme-toggle" aria-label="切換主題">🌙</button>
    </nav>
    <h1>K 線圖</h1>
    <div class="sub">查看 ETF 或其持股的每日開高低收、成交量與移動平均線。</div>
    <div class="panel">
      <div class="controls">
        <label>ETF<select id="etfSelect"></select></label>
        <label>標的<select id="securitySelect"></select></label>
        <label>圖表<div class="chart-type" role="group" aria-label="圖表類型"><button type="button" data-chart-type="candle">K 線</button><button type="button" data-chart-type="line">收盤價線圖</button></div></label>
        <div id="status" class="status"></div>
      </div>
    </div>
    <div class="panel">
      <div class="chart-head"><div id="chartTitle" class="chart-title">—</div><div id="quote" class="quote">—</div></div>
      <div class="legend"><span id="closeLegend" style="display:none"><i class="swatch" style="background:var(--accent)"></i>收盤價</span><span><i class="swatch" style="background:var(--ma5)"></i>MA5</span><span><i class="swatch" style="background:var(--ma20)"></i>MA20</span><span><i class="swatch" style="background:var(--kd-k)"></i>K(9)</span><span><i class="swatch" style="background:var(--kd-d)"></i>D(9)</span><span id="candleLegend">紅漲／綠跌</span></div>
      <div class="chart-wrap"><div id="chartBox" class="chart-box"></div><div id="tip" class="tip" aria-live="polite">將滑鼠移到圖表上半部的 K 線區域。</div></div>
      <div id="signalPanel" class="signal-panel"></div>
    </div>
  </div>
  <script src="theme.js"></script><script src="config.js"></script><script src="data.js"></script><script src="kline.js"></script>
</body>
</html>
