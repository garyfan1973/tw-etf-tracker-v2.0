<!DOCTYPE html>
<html lang="zh-Hant-tw">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的持股</title>
  <style>
    :root, :root[data-theme="light"] {
      --bg: #f5f6f8; --card: #ffffff; --text: #1c2430; --muted: #6b7684;
      --border: #e3e7ec; --up: #d64545; --down: #1f9d55; --accent: #3b5bdb;
      --chip: #eef1f6; --detail: #eaeefb; --key: #7c3aed;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #14181d; --card: #1c2229; --text: #e6e9ed; --muted: #98a2b0;
        --border: #2a323b; --up: #ff6b6b; --down: #51cf82; --accent: #6c8cff;
        --chip: #262d36; --detail: #222c3b; --key: #c4b5fd;
      }
    }
    :root[data-theme="dark"] {
      --bg: #14181d; --card: #1c2229; --text: #e6e9ed; --muted: #98a2b0;
      --border: #2a323b; --up: #ff6b6b; --down: #51cf82; --accent: #6c8cff;
      --chip: #262d36; --detail: #222c3b; --key: #c4b5fd;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
      line-height: 1.5; padding: 20px;
    }
    .wrap { max-width: 1000px; margin: 0 auto; }
    nav { display: flex; gap: 8px; margin-bottom: 14px; align-items: center; }
    nav a { text-decoration: none; color: var(--muted); font-size: 14px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); }
    nav a.active { color: #fff; background: var(--accent); border-color: var(--accent); }
    .theme-toggle { margin-left: 8px; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 16px; cursor: pointer; }
    .theme-toggle:hover { border-color: var(--accent); }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 16px; }
    /* 總覽卡 */
    .cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 16px; }
    .kpi { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; text-align: center; }
    .kpi .n { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .kpi .l { font-size: 12px; color: var(--muted); margin-top: 2px; }
    /* 表單 */
    .form-row { display: flex; flex-wrap: nowrap; gap: 6px; align-items: flex-end; }
    .form-row .fld { display: flex; flex-direction: column; }
    .form-row label { font-size: 12px; color: var(--muted); margin-bottom: 3px; white-space: nowrap; }
    .side-radios { display: flex; gap: 6px; }
    .side-radio { position: relative; }
    .side-radio input { position: absolute; opacity: 0; pointer-events: none; }
    .side-radio label { display: inline-flex; align-items: center; gap: 5px; margin: 0; padding: 8px 11px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--muted); cursor: pointer; font-size: 14px; }
    .side-radio input:checked + label { color: var(--text); border-color: var(--accent); background: rgba(59, 91, 219, .10); box-shadow: 0 0 0 1px var(--accent) inset; }
    .side-radio input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }
    input, button.act { font-size: 14px; padding: 8px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
    button.act { background: var(--accent); color: #fff; border: none; cursor: pointer; }
    button.ghost { background: none; border: 1px solid var(--border); color: var(--muted); cursor: pointer; border-radius: 8px; padding: 8px 10px; font-size: 14px; }
    .msg { font-size: 12px; color: var(--up); min-height: 16px; }
    /* 持股卡 */
    .hcard { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    #list { display: flex; flex-direction: column; gap: 12px; }
    #list > .hcard { margin: 0; }
    .hcard .top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .hcard .nm { font-size: 16px; font-weight: 700; }
    .hcard .cd { color: var(--muted); font-size: 13px; }
    .hcard .top .sp { margin-left: auto; display: flex; gap: 6px; }
    .grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px 14px; margin-top: 10px; }
    .grid .k { font-size: 11px; color: var(--muted); }
    .grid .v { font-size: 15px; font-variant-numeric: tabular-nums; margin-top: 1px; }
    .grid .key-field { padding: 5px 8px; border-radius: 8px; background: rgba(124, 58, 237, .10); }
    .grid .key-field .k, .grid .key-field .v { color: var(--key); font-weight: 700; }
    .sec { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); }
    .sec .h { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .lot-section { background: var(--detail); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
    .lot-section .lot { border-top-color: rgba(100, 116, 139, .3); }
    .lot-section .lot:first-of-type { border-top: none; }
    .divline { margin-top: 8px; font-size: 13px; color: var(--muted); }
    .divline b { color: var(--text); font-weight: 600; }
    .lot { padding: 10px 0; border-top: 1px dashed var(--border); }
    .lot:first-of-type { border-top: none; }
    .lot-top { display: flex; align-items: center; }
    .lot-top .sp { margin-left: auto; display: flex; gap: 6px; }
    .lot-toggle { margin-left: auto; border: 1px solid var(--border); background: var(--bg); color: var(--muted); border-radius: 8px; padding: 5px 9px; cursor: pointer; font-size: 12px; }
    .lot-toggle:hover { color: var(--accent); border-color: var(--accent); }
    .expand-cell { display: flex; align-items: center; justify-content: flex-end; }
    .detail-heading { padding: 0 0 6px; color: var(--muted); font-size: 12px; }
    .up { color: var(--up); } .down { color: var(--down); }
    .note { margin-top: 10px; font-size: 13px; color: var(--muted); }
    .sale-section { background: rgba(214, 69, 69, .06); border-color: rgba(214, 69, 69, .22); }
    .sale-section .h { color: var(--up); }
    .trade-row { padding: 8px 0; border-top: 1px dashed rgba(214, 69, 69, .25); font-size: 13px; }
    .trade-row:first-child { border-top: none; }
    .trade-row .sell { color: var(--up); font-weight: 600; }
    .sale-subhead { margin: 10px 0 4px; padding-top: 10px; border-top: 1px dashed rgba(214, 69, 69, .25); color: var(--up); font-size: 12px; font-weight: 600; }
    .icon-btn { width: 28px; height: 28px; padding: 0; border: 1px solid transparent; border-radius: 7px; background: transparent; color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; }
    .icon-btn:hover { color: var(--accent); border-color: var(--accent); background: var(--bg); }
    .icon-btn.delete:hover { color: var(--up); border-color: var(--up); }
    .empty { color: var(--muted); font-size: 14px; padding: 8px 0; }
    a.small { color: var(--accent); cursor: pointer; text-decoration: none; }
    @media (max-width: 720px) { .form-row { flex-wrap: wrap; } .cards { grid-template-columns: repeat(2, 1fr); } .grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
  <script>(function(){var t=localStorage.getItem("etf-theme");if(t)document.documentElement.dataset.theme=t;})();</script>
</head>
<body>
  <div class="wrap">
    <nav>
      <a href="index.html">持股 / 加減碼</a>
      <a href="dividends.html">配息日曆</a>
      <a href="portfolio.html" class="active">我的持股</a>
      <a href="transactions.html">交易紀錄</a>
      <span id="authBox" style="margin-left:auto;display:flex;align-items:center;gap:6px;"></span>
      <button id="themeToggle" class="theme-toggle" aria-label="切換主題">🌙</button>
    </nav>
    <h1>我的持股</h1>
    <div class="sub" id="sub">記錄你實際持有的 ETF 部位，自動帶出配息、現值與損益。</div>

    <div id="gate" class="panel" style="display:none;"></div>
    <div id="app" style="display:none;">
      <div class="cards" id="summary"></div>
      <div class="panel">
        <div style="font-size:14px;font-weight:600;margin-bottom:10px;" id="formTitle">新增交易</div>
        <div class="form-row">
          <div class="fld"><label>交易類型</label><div class="side-radios">
            <div class="side-radio"><input id="fSideBuy" type="radio" name="fSide" value="buy" checked><label for="fSideBuy">🛒 買入</label></div>
            <div class="side-radio"><input id="fSideSell" type="radio" name="fSide" value="sell"><label for="fSideSell">💰 賣出</label></div>
          </div></div>
          <div class="fld"><label>ETF 代號</label><input id="fCode" list="etfOptions" autocomplete="off" required placeholder="代號或名稱" style="width:135px;"><datalist id="etfOptions"></datalist></div>
          <div class="fld"><label id="fSharesLabel">股數</label><input id="fShares" type="number" min="0" required placeholder="例如 5000" style="width:98px;"></div>
          <div class="fld"><label id="fDateLabel">交易日期</label><input id="fDate" type="date" style="width:132px;"></div>
          <div class="fld"><label id="fPriceLabel">成交均價</label><input id="fPrice" type="number" step="0.01" min="0" required placeholder="例如 35.2" style="width:112px;"></div>
          <div class="fld" style="flex:1;min-width:100px;"><label>備註</label><input id="fNote" placeholder="例如 定期定額" style="width:100%;"></div>
          <button class="act" id="fSubmit">新增</button>
          <button class="ghost" id="fCancel" style="display:none;">取消</button>
        </div>
        <div class="msg" id="fMsg"></div>
      </div>
      <div id="list"></div>
    </div>
  </div>

  <script src="theme.js"></script>
  <script src="config.js"></script>
  <script src="data.js"></script>
  <script type="module" src="auth.js"></script>
  <script src="portfolio.js"></script>
</body>
</html>
